{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{% static 'css/app.css' %}"><title>New task | Workboard</title></head>
<body class="auth-wrap"><main class="form-panel"><p class="eyebrow">Task board</p><h1>Create a task.</h1><form class="form-stack" method="POST">{% csrf_token %}<label class="form-field">Title<input type="text" name="title" placeholder="What needs doing?" required></label><label class="form-field">Description<textarea name="description" rows="6" placeholder="Add useful context" required></textarea></label><button class="button button-primary" type="submit">Add task</button></form><p class="form-footer"><a href="{% url 'home' %}">Back to board</a></p></main></body></html>
