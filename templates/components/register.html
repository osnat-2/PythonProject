{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{% static 'css/app.css' %}"><title>Create account | Workboard</title></head>
<body class="auth-wrap"><main class="form-panel"><p class="eyebrow">Get started</p><h1>Create your account.</h1>
    <form class="form-stack" method="POST">{% csrf_token %}
        <label class="form-field">Username<input type="text" name="username" required></label>
        <label class="form-field">First name<input type="text" name="firstname" required></label>
        <label class="form-field">Last name<input type="text" name="lastname" required></label>
        <label class="form-field">Password<input type="password" name="password" required></label>
        <label class="form-field">Email<input type="email" name="email" required></label>
        <label class="form-field">Phone<input type="number" name="phone" required></label>
        <label class="form-field">Team<select name="team_id" required><option value="">Select team</option>{% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}</select></label>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}<button class="button button-primary" type="submit">Create account</button>
    </form><p class="form-footer">Already registered? <a href="{% url 'login' %}">Sign in</a></p>
</main></body></html>
